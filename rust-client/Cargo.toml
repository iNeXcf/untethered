[package]
name = "untethered-iced"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
async-channel = "2"
chrono = "0.4"
futures-util = "0.3"
serde_json = "1"
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "x11", "wayland", "advanced"] }
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt-multi-thread"] }
tokio-tungstenite = "0.28"
reqwest = { version = "0.12", default-features = false }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "webgl", "fira-sans", "advanced"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Worker", "WorkerOptions", "WorkerType", "ErrorEvent", "MessageEvent", "Document", "Window", "Navigator", "Clipboard"] }
js-sys = "0.3"

[profile.dev]
debug = 0
